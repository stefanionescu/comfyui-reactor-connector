[files]
extend-exclude = [
    "node_modules",
    ".venv",
    ".artifacts",
    "web/extension.js",
    "web/extension.css",
    "node.zip",
]

[default.extend-words]
certifi = "certifi"

# ComfyUI's Windows portable distribution uses this exact directory name.
[default.extend-identifiers]
python_embeded = "python_embeded"

# ESLint uses this exact option for immediately invoked function expressions.
IIFEs = "IIFEs"

# Semgrep registry version IDs are opaque values, not English words.
[type.semgrep]
extend-glob = ["packs.json"]
extend-ignore-re = ['"version": "[A-Za-z0-9]+"']
