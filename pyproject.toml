[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reactor-inc"
version = "0.1.0"
description = "Reactor video and world-model nodes for ComfyUI."
readme = "README.md"
authors = [{ name = "Stefan Ionescu" }]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = ["reactor-sdk>=1.4.0,<1.5", "yarl>=1.20,<2"]

[dependency-groups]
dev = [
  "aiohttp>=3.12,<4",
  "av>=16,<19",
  "basedpyright>=1.31,<2",
  "build>=1.3,<2",
  "markdown-it-py>=4,<5",
  "numpy>=2.2,<3",
  "packaging>=25,<27",
  "pillow>=11,<13",
  "pip-audit>=2.10.1,<3",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["reactor_comfy"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web/js"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]


[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["__init__.py", "reactor_comfy", "quality", "scripts"]
stubPath = "typings"
# Host-only modules use stubs for development outside ComfyUI.
reportMissingModuleSource = "none"
venvPath = "."
venv = ".venv"

[tool.reactor-comfy.host-dependencies]
aiohttp = ">=3.12,<4"
av = ">=16,<19"
numpy = ">=2.2,<3"
pillow = ">=11,<13"
torch = ">=2.6,<3"
