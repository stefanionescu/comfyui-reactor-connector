[project]
name = "reactor-inc"
version = "0.1.0"
description = "Reactor video and world-model nodes for ComfyUI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "reactor-sdk>=1.4,<1.5",
    "yarl>=1.20,<2",
]
urls.Repository = "https://github.com/stefanionescu/comfyui-reactor-connector"

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "av>=16,<19",
    "import-linter",
    "numpy>=2.2,<3",
    "pillow>=11,<14",
]

[tool.deptry]
exclude = [".artifacts", ".git", ".venv", "node_modules"]
ignore_notebooks = true
# ComfyUI supplies these modules and libraries in its own Python environment.
per_rule_ignores.DEP001 = [
    "comfy",
    "comfy_api",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "nodes",
    "server",
    "torch",
]
# ComfyUI installs these libraries, so the runtime package imports them as development dependencies.
per_rule_ignores.DEP004 = ["aiohttp", "av", "numpy", "PIL"]
known_first_party = ["scripts", "src"]
package_module_name_map.reactor-sdk = ["reactor"]

[tool.reactor-comfy]
host-dependencies.aiohttp = ">=3.12,<4"
host-dependencies.av = ">=16,<19"
host-dependencies.numpy = ">=2.2,<3"
host-dependencies.pillow = ">=11,<14"
host-dependencies.torch = ">=2.6,<3"

[tool.comfy]
DisplayName = "Reactor"
Icon = "https://raw.githubusercontent.com/stefanionescu/comfyui-reactor-connector/main/docs/images/logo.png"
requires-comfyui = ">=0.34.6"

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the ComfyUI boundary, the media package, the nodes, and the extension import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "src.config",
    "src.credentials",
    "src.errors",
    "src.execution",
    "src.live",
    "src.models",
    "src.paths",
    "src.routing",
    "src.runtime",
    "src.serialization",
    "src.settings",
    "src.state",
    "src.storage",
    "src.tasks",
]
forbidden_modules = [
    "comfy",
    "comfy_api",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "nodes",
    "server",
    "torch",
]
