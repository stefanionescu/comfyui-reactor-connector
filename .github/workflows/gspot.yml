# Generated by gspot. Do not edit this file; change gspot.toml, then run gspot install.
name: gspot

on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false

      - name: Install gspot
        run: |-
          mise install node@24.20.0 'npm:@gspothq/cli[allow_low_downloads=true]@0.4.2' bun@1.4.3
          mise bin-paths node@24.20.0 'npm:@gspothq/cli[allow_low_downloads=true]@0.4.2' bun@1.4.3 >> "$GITHUB_PATH"

      - name: Set up the project
        run: mise run ci:setup

      - name: Install gspot tools
        run: |-
          gspot install
          git add --intent-to-add -- .
          git diff --exit-code || { echo "::error::gspot install changed files. Run gspot install, then commit the files that it changed."; exit 1; }

      - name: Lint
        env:
          GSPOT_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          gspot check --base "${GSPOT_CI_BASE}"
