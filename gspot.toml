#:schema ./.gspot/gspot.schema.json
# gspot settings for this repository. Change them with gspot set, unset, add, remove, ignore, and unignore.

level = "all"
configurations = ["bash", "css", "javascript", "licenses", "markdown", "python", "typescript"]

[hooks]
enabled = true

[ci]
enabled = true

[format]
quotes = "single"

[[naming.override]]
allowed_names = ["x2", "X2EditVideo", "X2Operation", "X2Request", "X2Webcam"]
reason = "X2 is the name of Reactor's model, digit included; its packages, modules, and classes are named after it, as those of the other model families are."

[spelling.allowed_words]
SANA = "SANA is the name of a video model that Reactor runs, written in capitals; it is not an acronym to spell out."
LTX = "LTX is the name of a video model that Reactor runs, written in capitals; it is not an acronym to spell out."
MOV = "MOV is the QuickTime video file format name, which readers know."
AVI = "AVI is the video file format name, which readers know."
JPEG = "JPEG is the image file format name, which readers know."
PNG = "PNG is the image file format name, which readers know."
WAV = "WAV is the audio file format name, which readers know."
MP4 = "MP4 is the video file format name, which readers know."

[python]
externals = ["comfy", "comfy_api", "comfy_execution", "comfy_extras", "folder_paths", "nodes", "server", "torch"]

[tools.eslint]
import_extension = "ts"

[[tools.eslint.override]]
paths = ["web/scripts/**"]
runtime = "browser"

[tools.commitlint]
scopes = ["nodes", "frontend", "workflows", "docs", "hooks", "quality", "root", "deps"]

[tools.knip]
entry = ["web/scripts/extension.ts"]

# The browser code in layers. Each rule lists exactly what its files may import, besides their own folder.
[[import_rule]]
name = "page"
paths = ["web/scripts/browser.ts", "web/scripts/dom.ts", "web/scripts/host.d.ts", "web/scripts/http.ts", "web/scripts/routes.ts", "web/scripts/schema.ts", "web/scripts/text.ts"]
can_import = []

[[import_rule]]
name = "settings-dialog"
paths = ["web/scripts/settings/**"]
can_import = ["page"]

[[import_rule]]
name = "live-controls"
paths = ["web/scripts/live/**"]
can_import = ["page"]

[[import_rule]]
name = "extension"
paths = ["web/scripts/extension.ts"]
can_import = ["page", "settings-dialog", "live-controls"]

# The Python packages in layers, the same way. config holds fixed values and state holds the records, and both import
# nothing; settings never imports execution, the nodes, or the ComfyUI boundary; execution never imports the nodes or
# the ComfyUI boundary; comfy is the boundary with ComfyUI; entry is the package's own entry points; scripts are the
# development scripts, which no runtime package imports.
[[import_rule]]
name = "config"
paths = ["src/config/**"]
can_import = []

[[import_rule]]
name = "state"
paths = ["src/state/**"]
can_import = []

[[import_rule]]
name = "basics"
paths = ["src/errors.py", "src/paths.py", "src/tasks.py"]
can_import = []

[[import_rule]]
name = "records"
paths = ["src/credentials.py", "src/models.py", "src/serialization.py", "src/storage.py"]
can_import = ["config", "state", "basics"]

[[import_rule]]
name = "settings"
paths = ["src/settings/**"]
can_import = ["config", "state", "basics", "records", "routing"]

[[import_rule]]
name = "routing"
paths = ["src/routing/**"]
can_import = ["config", "state", "basics", "records", "settings"]

[[import_rule]]
name = "execution"
paths = ["src/execution/**"]
can_import = ["config", "state", "basics", "records", "media"]

[[import_rule]]
name = "media"
paths = ["src/media/**"]
can_import = ["config", "state", "basics", "records", "execution"]

[[import_rule]]
name = "live"
paths = ["src/live/**"]
can_import = ["config", "state", "basics", "records", "routing", "execution", "media"]

[[import_rule]]
name = "runtime"
paths = ["src/runtime.py"]
can_import = ["config", "basics", "records", "settings", "live"]

[[import_rule]]
name = "comfy"
paths = ["src/comfy/**"]
can_import = ["config", "state", "basics", "records", "settings", "execution", "media", "live", "runtime"]

[[import_rule]]
name = "nodes"
paths = ["src/nodes/**"]
can_import = ["config", "state", "basics", "settings", "execution", "media", "runtime", "comfy"]

[[import_rule]]
name = "entry"
paths = ["__init__.py", "__main__.py", "src/__init__.py", "src/extension.py"]
can_import = ["media", "runtime", "comfy", "nodes"]

[[import_rule]]
name = "scripts"
paths = ["scripts/**"]
can_import = ["state", "records", "nodes", "entry"]

# Import rules skip modules that the host provides, so import-linter checks the one rule they cannot hold: only the
# ComfyUI boundary, the media package, the nodes, and the extension import ComfyUI's modules. The contract is in
# pyproject.toml.
[[command_check]]
id = "comfy-boundary"
command = ["uv", "run", "--no-sync", "lint-imports"]
paths = ["src/**", "pyproject.toml"]
stage = "commit"
summary = "Checks that only src/comfy, src/media, src/nodes, and src/extension.py import ComfyUI's modules."
help = "Move the import into src/comfy or src/nodes, and pass the value it gives to the other package."
exit_codes = [1]
output = { format = "regex", pattern = "^-\\s+(?<message>\\S+ -> \\S+) \\(l\\.(?<line>\\d+)\\)$" }

# The repository's own checks of what it builds and ships, as the old hooks ran them.
[[command_check]]
id = "comfy-requirements"
command = ["bash", ".mise/tasks/comfy/requirements/check"]
paths = ["pyproject.toml", "requirements.txt", "scripts/dependencies.py"]
stage = "commit"
summary = "Checks that requirements.txt lists the runtime dependencies in pyproject.toml."
help = "Run mise run comfy:requirements:build, then commit requirements.txt."
exit_codes = [1]
output = { format = "regex", pattern = "^(?<message>Update requirements\\.txt .+)$" }

[[command_check]]
id = "comfy-frontend"
command = ["bash", ".mise/tasks/comfy/frontend/check"]
paths = ["web/scripts/**", "web/extension.js", "web/extension.css", "package.json", "bun.lock", "scripts/frontend.py"]
stage = "commit"
summary = "Checks that web/extension.js and web/extension.css match a fresh build of web/scripts."
help = "Run bun run build, then commit web/extension.js and web/extension.css."
exit_codes = [1]
output = { format = "regex", pattern = "^(?<message>Rebuild .+)$" }

[[command_check]]
id = "comfy-nodes"
command = ["bash", ".mise/tasks/comfy/nodes/check"]
paths = ["__init__.py", "src/**", "scripts/nodes/**", "web/docs/**"]
stage = "push"
summary = "Checks that every node registers a unique ID, a display name, a description, and a Reactor category, and that every help page in web/docs names a registered node."
help = "Name the help page web/docs/<node ID>.md, and give the node the schema fields that the message names."
exit_codes = [1]
output = { format = "lines" }

[[command_check]]
id = "comfy-workflows"
command = ["bash", ".mise/tasks/comfy/workflows/check"]
paths = ["__init__.py", "src/**", "scripts/**", "web/docs/**", "example_workflows/**", "README.md"]
stage = "push"
summary = "Checks that the example workflows match a fresh build from scripts/workflows, and that README.md links each one."
help = "Run mise run comfy:workflows:build, then commit the example workflows."
exit_codes = [1]
output = { format = "lines" }

[[ignore]]
check = "duplication/jscpd"
paths = ["src/nodes/**"]
reason = "Each video node repeats the ComfyUI node shape (imports, define_schema, generate); jscpd's strict mode matches that shape with names and strings set aside."

[[ignore]]
check = "javascript/eslint"
rule = "gspot/import-boundaries"
paths = ["web/scripts/extension.ts", "web/scripts/http.ts", "web/scripts/text.ts"]
reason = "ComfyUI serves ../../scripts/app.js and ../../scripts/api.js at runtime; esbuild leaves them external."

[[ignore]]
check = "javascript/eslint"
rule = "n/file-extension-in-import"
paths = ["web/scripts/extension.ts", "web/scripts/http.ts", "web/scripts/text.ts"]
reason = "ComfyUI serves ../../scripts/app.js and ../../scripts/api.js at runtime; esbuild leaves them external."

[[ignore]]
check = "javascript/knip"
rule = "unresolved"
paths = ["web/scripts/extension.ts", "web/scripts/http.ts", "web/scripts/text.ts"]
reason = "ComfyUI serves ../../scripts/app.js and ../../scripts/api.js at runtime; esbuild leaves them external."

[[ignore]]
check = "naming/paths"
paths = ["web/docs/**"]
reason = "ComfyUI reads each node's help page from web/docs/<node id>.md, so the file name must equal the registered node ID."

[[ignore]]
check = "naming/paths"
rule = "banned-word"
paths = ["ADVANCED.md"]
reason = "ADVANCED.md is the advanced guide of every pack in the family, the name its readers and the README link know."

[[ignore]]
check = "prose/vale"
rule = "write-good.E-Prime"
reason = "E-Prime bans every form of 'to be'; rewriting every such sentence makes the docs harder to read, not plainer."

[[ignore]]
check = "python/vulture"
names = ["comfy_entrypoint"]
paths = ["__init__.py"]
reason = "ComfyUI calls the package's comfy_entrypoint by name."

[[ignore]]
check = "python/vulture"
names = ["on_load", "get_node_list"]
paths = ["src/extension.py"]
reason = "ComfyUI calls the extension's on_load and get_node_list by name."

[[ignore]]
check = "python/vulture"
names = ["define_schema", "execute", "validate_inputs", "fingerprint_inputs"]
paths = ["src/nodes/**"]
reason = "ComfyUI calls each node's define_schema, execute, validate_inputs, and fingerprint_inputs by name."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["example_workflows/**"]
reason = "ComfyUI's template browser reads one flat example_workflows folder, and the owner names each workflow <family>-<two-digit number>-<task>."

[[ignore]]
check = "structure/trivial-functions"
names = ["comfy_entrypoint"]
paths = ["__init__.py"]
reason = "ComfyUI calls the package's comfy_entrypoint by name, so it cannot be inlined."

[[ignore]]
check = "structure/trivial-functions"
names = ["__init__"]
paths = ["src/errors.py"]
reason = "ConnectorError's constructor keeps the error code beside the message that RuntimeError stores; every raise calls it."

[[ignore]]
check = "structure/trivial-functions"
names = ["on_load", "get_node_list"]
paths = ["src/extension.py"]
reason = "ComfyUI calls the extension's on_load and get_node_list by name, so they cannot be inlined."

[[ignore]]
check = "structure/trivial-functions"
names = ["define_schema", "execute", "validate_inputs", "fingerprint_inputs"]
paths = ["src/nodes/**"]
reason = "ComfyUI calls each node's define_schema, execute, validate_inputs, and fingerprint_inputs by name, so they cannot be inlined."
